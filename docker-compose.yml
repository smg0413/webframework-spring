services:
  mysql:
    image: mysql:8.4.11
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: webframework
      MYSQL_USER: webframework
      MYSQL_PASSWORD: local-dev-password
      MYSQL_ROOT_PASSWORD: root-local-only
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping"]
      interval: 5s
      retries: 20
volumes:
  mysql-data: